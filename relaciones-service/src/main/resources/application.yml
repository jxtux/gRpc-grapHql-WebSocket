server:
  port: 8082

spring:
  application:
    name: relaciones-service
  datasource:
    url: jdbc:h2:mem:relationsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    internal-api-key: ${INTERNAL_API_KEY:secret-internal-key}

logging:
  level:
    root: INFO
    com.demo.relaciones: DEBUG
  file:
    name: logs/relaciones-service.log
