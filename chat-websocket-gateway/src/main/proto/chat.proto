syntax = "proto3";

package chat;

option java_multiple_files = true;
option java_package = "com.demo.chat.proto";
option java_outer_classname = "ChatProto";

service ChatService {
  rpc ChatStream(stream ChatClientEvent) returns (stream ChatServerEvent);
  rpc GetHistory(ChatHistoryRequest) returns (ChatHistoryResponse);
  rpc GetPresence(UserPresenceRequest) returns (UserPresenceResponse);
}

enum ChatEventType {
  UNKNOWN = 0;
  CONNECT = 1;
  DISCONNECT = 2;
  MESSAGE = 3;
  MESSAGE_RECEIVED = 4;
  USER_ONLINE = 5;
  USER_OFFLINE = 6;
  HISTORY = 7;
  ERROR = 8;
}

message ChatClientEvent {
  string event_id = 1;
  int64 from_user_id = 2;
  int64 to_user_id = 3;
  string content = 4;
  ChatEventType type = 5;
  string token = 6;
}

message ChatServerEvent {
  string event_id = 1;
  int64 from_user_id = 2;
  int64 to_user_id = 3;
  string content = 4;
  ChatEventType type = 5;
  string created_at = 6;
  bool online = 7;
}

message ChatHistoryRequest {
  int64 user_id = 1;
  int64 other_user_id = 2;
}

message ChatHistoryResponse {
  repeated ChatServerEvent messages = 1;
}

message UserPresenceRequest {
  int64 user_id = 1;
}

message UserPresenceResponse {
  int64 user_id = 1;
  bool online = 2;
  string last_seen_at = 3;
}
